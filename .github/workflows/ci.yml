# 001 FR-SC-014 — CI Windows không GPU (D12 mục 7). Đặt CI là required check để chặn merge khi đỏ.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SF_GPU: '0'
      SF_LLM: replay
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Commit messages reference NNN (FR-SC-019)
        if: github.event_name == 'pull_request'
        run: node scripts/check-commit-msg.mjs --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - run: node scripts/doctor.mjs
      - run: npm ci
      - run: uv sync
        working-directory: workers/gpu
      - run: npx playwright install-deps || true
        shell: bash
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: verify-report.json
