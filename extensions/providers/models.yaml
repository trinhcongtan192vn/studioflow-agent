# Danh mục thành phần tải theo yêu cầu (D4 mục 10, 014). `dest` tương đối <app-data>.
# URL ghim theo bản phát hành/commit; sha256 + size lấy từ GitHub release digest / Hugging Face LFS
# (2026-10-04). Mở rộng 014: `extract` (giải nén zip vào thư mục), `content` (file văn bản nhỏ),
# `python_env` (môi trường engine cài bằng uv — pip tự kiểm hash gói).
