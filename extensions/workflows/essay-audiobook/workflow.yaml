# Workflow `essay-audiobook` (FN-029, D6 mục 1) — tiểu luận/sách nói nhịp chậm, hình tối giản, trích dẫn nổi bật.
id: essay-audiobook
version: 1.0.0
title: Tiểu luận / sách nói
description: Tiểu luận hoặc sách nói 10–40 phút về tâm lý, triết học, tóm tắt sách — nhịp chậm, nhiều khoảng lặng, hình tối giản, trích dẫn nổi bật, chia chương.
app_api: '>=1.0 <2.0'
upstream: { hyperframes_workflow: faceless-explainer, hyperframes_version: '0.8.115' }
output_profiles: [yt-1080p30]
requires: [tts.synthesize, asr.align]
optional: [image.generate]
brief:
  questions:
    - Chủ đề / câu hỏi trung tâm của bài?
    - Tác phẩm và tác giả gốc (nếu tóm tắt sách)?
    - Các trích dẫn cần có (nguyên văn, kèm nguồn)?
    - Khán giả là ai, họ nên nghĩ khác đi điều gì sau khi nghe?
    - Độ dài mục tiêu (mặc định 20 phút)?
# tầng cấu hình workflow (D3 7.1): caption tĩnh, cụm dài; nhạc nền nhỏ; khoảng lặng sau mỗi câu
config_defaults:
  caption.style: caption-static
  caption.max_words: 10
  music.volume_db: -10
  voice.pause_after_ms: 600
steps:
  - { id: design, uses: design-system, title: Design system }
  - id: script
    uses: script
    title: Kịch bản
    params: { mode: narration }
    refine: { enabled: true, rubric: script-essay }
    approval: { required: true }
  - { id: voice, uses: voice, title: Giọng đọc }
  # luồng v2: một lượt Opus lên danh sách cảnh (ảnh, layout, chữ, chuyển động, nhạc)
  - id: direct
    uses: direct
    title: Đạo diễn hình
    params:
      style: 'Sách nói / tiểu luận: ảnh không khí, tĩnh lặng, ít cảnh, chuyển động rất chậm; trích câu quan trọng bằng quote.'
      max_shot_s: 12
      prefer: [image-caption, quote, image-title]
  - { id: media, uses: media, title: Ảnh và nhạc }
  # dựng hình bằng bộ layout + kiểm cuối tự sửa; duyệt bản xem trước trước khi render phát hành
  - id: compose
    uses: compose
    title: Dựng hình
    approval: { required: true }
  - id: meta
    uses: publish-meta
    title: Tiêu đề, mô tả, chương
    refine: { enabled: true, rubric: meta-default }
  - { id: thumbnail, uses: thumbnail, title: Thumbnail }
  - { id: render, uses: render, title: Render phát hành, params: { mode: release } }
  # 091: đăng ngay lên nền tảng người dùng chọn (video Autopilot: kế hoạch ngày lo việc đăng)
  - { id: publish, uses: publish, title: Đăng lên nền tảng }
