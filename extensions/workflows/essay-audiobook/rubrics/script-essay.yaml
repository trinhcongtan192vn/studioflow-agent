# Rubric kịch bản tiểu luận / sách nói (FN-029): chiều sâu và mạch ý thay cho hook.
id: script-essay
version: 1
scale: 10
criteria:
  - {
      id: depth,
      weight: 0.3,
      prompt: 'Bài có đi sâu vào ý tưởng (lập luận, phản biện, ví dụ đời thường) thay vì liệt kê bề mặt không?',
    }
  - {
      id: flow,
      weight: 0.25,
      prompt: 'Các ý nối nhau mạch lạc, mỗi beat (1–3 phút) là một chương trọn ý có câu chuyển rõ?',
    }
  - {
      id: fidelity,
      weight: 0.2,
      prompt: 'Trích dẫn đúng nguyên văn và ghi nguồn; tóm tắt sách trung thực với tác phẩm gốc?',
    }
  - {
      id: pacing,
      weight: 0.15,
      prompt: 'Câu văn cho giọng đọc chậm: câu vừa phải, có khoảng lặng để người nghe suy ngẫm, không dồn ý?',
    }
  - { id: opening, weight: 0.1, prompt: 'Mở đầu có đặt câu hỏi đủ gợi tò mò để nghe tiếp không?' }
severity_rules: 'critical: trích dẫn sai/bịa hoặc xuyên tạc tác phẩm; major: ý hời hợt hoặc chương rời rạc; minor: đánh bóng câu chữ'
