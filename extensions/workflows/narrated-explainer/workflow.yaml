# Workflow `narrated-explainer` (FN-016, D6 mục 1) — fork từ HyperFrames `faceless-explainer`.
id: narrated-explainer
version: 1.0.0
title: Video thuyết minh
description: Video thuyết minh 3–15 phút một người dẫn — khoa học phổ thông, giải thích khái niệm, tóm tắt sách; mỗi ý có ảnh minh họa, số liệu và danh sách bằng đồ họa động.
app_api: '>=1.0 <2.0'
upstream: { hyperframes_workflow: faceless-explainer, hyperframes_version: '0.8.115' }
output_profiles: [yt-1080p30]
requires: [tts.synthesize, asr.align]
optional: [image.generate]
brief:
  questions:
    - Chủ đề của video là gì?
    - Khán giả là ai?
    - Thông điệp chính muốn người xem nhớ?
    - Độ dài mục tiêu (mặc định 8 phút)?
steps:
  - { id: design, uses: design-system, title: Design system }
  - id: script
    uses: script
    title: Kịch bản
    params: { mode: narration }
    refine: { enabled: true, rubric: script-default }
    approval: { required: true }
  - { id: voice, uses: voice, title: Giọng đọc }
  # luồng v2: một lượt Opus lên danh sách cảnh (ảnh, layout, chữ, chuyển động, nhạc)
  - id: direct
    uses: direct
    title: Đạo diễn hình
    params:
      style: 'Giải thích rõ ràng như video hoạt hình giải thích: nhân vật/đối tượng chính diễn theo từng ý trên bối cảnh (scene), số liệu bằng stat-pop/chart-bar, các bước bằng list.'
      max_shot_s: 8
      prefer: [scene, image-title, stat-pop, chart-bar, list, image-zoom-detail]
  - { id: media, uses: media, title: Ảnh và nhạc }
  # dựng hình bằng bộ layout + kiểm cuối tự sửa; duyệt bản xem trước trước khi render phát hành
  - id: compose
    uses: compose
    title: Dựng hình
    approval: { required: true }
  - id: meta
    uses: publish-meta
    title: Tiêu đề và mô tả
    refine: { enabled: true, rubric: meta-default }
  - { id: thumbnail, uses: thumbnail, title: Thumbnail }
  - { id: render, uses: render, title: Render phát hành, params: { mode: release } }
  # 091: đăng ngay lên nền tảng người dùng chọn (video Autopilot: kế hoạch ngày lo việc đăng)
  - { id: publish, uses: publish, title: Đăng lên nền tảng }
