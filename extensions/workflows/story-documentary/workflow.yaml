# Workflow `story-documentary` (FN-023, D6 mục 1) — kể chuyện tài liệu nhiều scene, ảnh sinh theo look kênh.
id: story-documentary
version: 1.0.0
title: Phim tài liệu kể chuyện
description: Kể chuyện tài liệu 8–20 phút (lịch sử, nhân vật, sự kiện) — nhiều scene theo không gian/thời gian, bản đồ, dòng thời gian, ảnh minh họa sinh theo look kênh.
app_api: '>=1.0 <2.0'
upstream: { hyperframes_workflow: faceless-explainer, hyperframes_version: '0.8.115' }
output_profiles: [yt-1080p30]
requires: [tts.synthesize, asr.align, image.generate]
brief:
  questions:
    - Câu chuyện/sự kiện nào, trong khoảng thời gian nào?
    - Các mốc thời gian chính?
    - Địa danh chính?
    - Nhân vật chính?
    - Nguồn tham khảo (sách, tài liệu) để đối chiếu?
    - Khán giả là ai, thông điệp muốn để lại?
    - Độ dài mục tiêu (mặc định 10 phút)?
steps:
  - { id: design, uses: design-system, title: Design system }
  - id: script
    uses: script
    title: Kịch bản
    params: { mode: narration }
    refine: { enabled: true, rubric: script-documentary }
    approval: { required: true }
  - { id: voice, uses: voice, title: Giọng đọc }
  # luồng v2: một lượt Opus lên danh sách cảnh (ảnh, layout, chữ, chuyển động, nhạc)
  - id: direct
    uses: direct
    title: Đạo diễn hình
    params:
      style: 'Phim tài liệu: nhân vật lịch sử/đối tượng chính diễn lại câu chuyện trên bối cảnh chân thực (scene), xen ảnh điện ảnh cho cảnh rộng và chi tiết; chữ tối thiểu (năm, địa danh); chuyển động chậm.'
      max_shot_s: 8
      prefer: [scene, image-caption, image-zoom-detail, quote]
      # nhạc đổi theo chương khi không khí đổi rõ (các workflow khác: một bài cho cả video)
      music: per-scene
  - { id: media, uses: media, title: Ảnh và nhạc }
  # dựng hình bằng bộ layout + kiểm cuối tự sửa; duyệt bản xem trước trước khi render phát hành
  - id: compose
    uses: compose
    title: Dựng hình
    approval: { required: true }
  - id: meta
    uses: publish-meta
    title: Tiêu đề, mô tả, chương
    refine: { enabled: true, rubric: meta-default }
  - { id: thumbnail, uses: thumbnail, title: Thumbnail }
  - { id: render, uses: render, title: Render phát hành, params: { mode: release } }
  # 091: đăng ngay lên nền tảng người dùng chọn (video Autopilot: kế hoạch ngày lo việc đăng)
  - { id: publish, uses: publish, title: Đăng lên nền tảng }
