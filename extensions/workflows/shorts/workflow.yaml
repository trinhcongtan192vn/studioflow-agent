# Workflow `shorts` (FN-030, D6 mục 1) — video dọc ≤ 3 phút: Hook → Insight → Paradox; mới hoặc cắt từ video dài.
id: shorts
version: 1.0.0
title: Shorts dọc
description: Video dọc 9:16 tối đa 3 phút theo cấu trúc Hook → Insight → Paradox — viết mới, hoặc cắt từ một video dài của kênh (dùng lại lời đọc, viết lại hook, dựng lại khung dọc).
app_api: '>=1.0 <2.0'
upstream: { hyperframes_workflow: motion-graphics, hyperframes_version: '0.8.115' }
output_profiles: [yt-shorts-1080x1920]
requires: [tts.synthesize, asr.align]
optional: [image.generate]
brief:
  questions:
    - Viết mới hay cắt từ video dài nào của kênh (source_video_id)? Dùng những đoạn/beat nào?
    - Một ý duy nhất người xem phải nhớ?
    - Câu hook 3–5 giây đầu?
    - Độ dài mục tiêu (mặc định 45 giây, tối đa 3 phút)?
# tầng cấu hình workflow (D3 7.1): caption karaoke lớn giữa màn hình, tiêu đề ngắn, #shorts
config_defaults:
  caption.style: caption-pill-karaoke
  caption.max_words: 3
  meta.title_max: 60
  meta.hashtags: ['#shorts']
  frame.min_duration_ms: 2000
steps:
  - { id: design, uses: design-system, title: Design system }
  - id: script
    uses: script
    title: Kịch bản
    params: { mode: narration }
    refine: { enabled: true, rubric: script-shorts }
    approval: { required: true }
  - id: voice
    uses: voice
    title: Giọng đọc
    gate: [{ kind: objective, check: max_duration, params: { source: audio } }]
  # luồng v2: một lượt Opus lên danh sách cảnh (ảnh, layout, chữ, chuyển động, nhạc)
  - id: direct
    uses: direct
    title: Đạo diễn hình
    params:
      style: 'Nhịp nhanh, mỗi cảnh một hình mạnh; hook bằng hình gây tò mò; chữ rất ngắn ở nửa trên.'
      max_shot_s: 5
      prefer: [image-title, image-caption, image-split, stat-pop, big-text]
  - { id: media, uses: media, title: Ảnh và nhạc }
  # dựng hình bằng bộ layout + kiểm cuối tự sửa; duyệt bản xem trước trước khi render phát hành
  - id: compose
    uses: compose
    title: Dựng hình
    approval: { required: true }
    # chữ trong vùng an toàn dọc (đo trong Chrome; tràn → tự co chữ)
    gate: [{ kind: objective, check: text_safe_area }]
  - id: meta
    uses: publish-meta
    title: Tiêu đề và mô tả
    refine: { enabled: true, rubric: meta-default }
  - { id: render, uses: render, title: Render phát hành, params: { mode: release } }
  # 091: đăng ngay lên nền tảng người dùng chọn (video Autopilot: kế hoạch ngày lo việc đăng)
  - { id: publish, uses: publish, title: Đăng lên nền tảng }
