# Workflow `shorts` (FN-030, D6 mục 1) — video dọc ≤ 60 giây: Hook → Insight → Paradox; mới hoặc cắt từ video dài.
id: shorts
version: 1.0.0
title: Shorts dọc
description: Video dọc 9:16 dưới 60 giây theo cấu trúc Hook → Insight → Paradox — viết mới, hoặc cắt từ một video dài của kênh (dùng lại lời đọc, viết lại hook, dựng lại khung dọc).
app_api: '>=1.0 <2.0'
upstream: { hyperframes_workflow: motion-graphics, hyperframes_version: '0.8.115' }
output_profiles: [yt-shorts-1080x1920]
requires: [tts.synthesize, asr.align]
optional: [image.generate]
brief:
  questions:
    - Viết mới hay cắt từ video dài nào của kênh (source_video_id)? Dùng những đoạn/beat nào?
    - Một ý duy nhất người xem phải nhớ?
    - Câu hook 3–5 giây đầu?
    - Độ dài mục tiêu (mặc định 45 giây, tối đa 60)?
# tầng cấu hình workflow (D3 7.1): caption karaoke lớn giữa màn hình, tiêu đề ngắn, #shorts
config_defaults:
  caption.style: caption-pill-karaoke
  caption.max_words: 3
  meta.title_max: 60
  meta.hashtags: ['#shorts']
  frame.min_duration_ms: 2000
steps:
  - { id: design, uses: design-system, title: Design system }
  - id: script
    uses: script
    title: Kịch bản
    params: { mode: narration }
    refine: { enabled: true, rubric: script-shorts }
    approval: { required: true }
  - { id: storyboard, uses: storyboard, title: Storyboard, approval: { required: true } }
  - id: voice
    uses: voice
    title: Giọng đọc
    gate: [{ kind: objective, check: max_duration, params: { source: audio } }]
  - { id: assets, uses: assets, title: Hình ảnh }
  - { id: frames, uses: frame-build, title: Dựng frame dọc }
  - {
      id: finish,
      uses: finish,
      title: 'Hoàn thiện hình (look, hiệu ứng, overlay)',
      skip_if: { phase_before: M3 },
    }
  - { id: captions, uses: captions, title: Phụ đề karaoke }
  # 085: nhạc nền là tính năng nâng cao (advanced.music), mặc định bỏ qua
  - { id: music, uses: music, title: Nhạc nền, skip_if: { config: advanced.music, equals: false } }
  - id: finalize
    uses: finalize
    title: Hoàn thiện
    approval: { required: true }
    gate:
      - { kind: objective, check: max_duration, params: { source: timeline } }
      - { kind: objective, check: text_safe_area }
  - id: meta
    uses: publish-meta
    title: Tiêu đề và mô tả
    refine: { enabled: true, rubric: meta-default }
  - { id: render, uses: render, title: Render phát hành, params: { mode: release } }
