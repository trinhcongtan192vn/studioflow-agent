<template>
  <div id="root" data-composition-id="{{composition_id}}" data-width="{{width}}" data-height="{{height}}">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      #root { position: relative; width: {{width}}px; height: {{height}}px; }
      .lt { position: absolute; left: 6%; bottom: 24%; display: flex; align-items: stretch; border-radius: 0.8vh; overflow: hidden; box-shadow: 0 1.2vh 4vh rgba(0, 0, 0, 0.28); }
      .lt-tab { width: 0.9vh; background: {{accent}}; }
      .lt-body { background: rgba(255, 255, 255, 0.94); padding: 1.8vh 3.4vh 2vh 2.4vh; display: flex; flex-direction: column; gap: 0.6vh; }
      .lt-title { font-family: sans-serif; font-size: 4.6vh; font-weight: 700; color: #111418; line-height: 1.1; white-space: nowrap; }
      .lt-sub { font-family: sans-serif; font-size: 2.6vh; color: #4a515c; line-height: 1.2; white-space: nowrap; }
    </style>
    <div id="{{composition_id}}-clip" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0">
      <div id="{{composition_id}}-lt" class="lt">
        <div id="{{composition_id}}-tab" class="lt-tab"></div>
        <div class="lt-body">
          <div id="{{composition_id}}-title" class="lt-title">{{vars.title}}</div>
          <div id="{{composition_id}}-sub" class="lt-sub">{{vars.subtitle}}</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#{{composition_id}}-lt", { clipPath: "inset(0 100% 0 0)" }, 0);
      tl.set(["#{{composition_id}}-title", "#{{composition_id}}-sub"], { y: 20, opacity: 0 }, 0);
      tl.to("#{{composition_id}}-lt", { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 0.1);
      tl.to("#{{composition_id}}-title", { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.to("#{{composition_id}}-sub", { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.to("#{{composition_id}}-lt", { y: 16, opacity: 0, duration: 0.35, ease: "power2.in" }, {{out_at}});
      window.__timelines["{{composition_id}}"] = tl;
    </script>
  </div>
</template>
