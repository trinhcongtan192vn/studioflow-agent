<template>
  <div id="root" data-composition-id="{{composition_id}}" data-width="{{width}}" data-height="{{height}}">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      #root { position: relative; width: {{width}}px; height: {{height}}px; }
      .tag { position: absolute; left: 6%; top: 8%; padding: 1.2vh 2.4vh; border-left: 0.6vh solid {{accent}}; background: rgba(0, 0, 0, 0.55); }
      .tag-place { font-family: sans-serif; font-size: 3.4vh; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #ffffff; white-space: nowrap; }
      .tag-time { font-family: sans-serif; font-size: 2.4vh; color: #d9dde3; white-space: nowrap; }
    </style>
    <div id="{{composition_id}}-clip" class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0">
      <div id="{{composition_id}}-tag" class="tag">
        <div id="{{composition_id}}-place" class="tag-place">{{vars.place}}</div>
        <div id="{{composition_id}}-time" class="tag-time">{{vars.time}}</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#{{composition_id}}-tag", { x: -40, opacity: 0 }, 0);
      tl.to("#{{composition_id}}-tag", { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.to("#{{composition_id}}-tag", { opacity: 0, duration: 0.4, ease: "power2.in" }, {{out_at}});
      window.__timelines["{{composition_id}}"] = tl;
    </script>
  </div>
</template>
