[project]
name = "sf-worker"
version = "0.1.0"
description = "StudioFlow GPU worker (OmniVoice, audio analysis, CLAP)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", { include-group = "audio" }]
# engine audio-analysis (CPU, 012): cũng cài vào <app-data>/providers/python/audio-analysis
audio = ["librosa==0.11.0", "pyloudnorm==0.1.1", "soundfile==0.13.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sf_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU; skipped when SF_GPU=0 (D12)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
